<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mortar Calc">
<link rel="manifest" href="manifest.json">
<title>WARDOGS Mortar Calculator</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    padding: 30px 20px;
    background: #1e1e1e;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #f0f0f0;
    flex-wrap: wrap;
  }

  .card {
    width: 500px;
    max-width: 95vw;
    background: #2b2b2b;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0 0 25px;
  }

  label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
  }

  input[type="text"],
  textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #1e1e1e;
    color: #f0f0f0;
    margin-bottom: 15px;
    font-family: inherit;
    resize: vertical;
  }

  input[type="text"]:focus,
  textarea:focus {
    outline: none;
    border-color: #4a90d9;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  button {
    padding: 10px 20px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #4a90d9;
    color: white;
  }

  button.clear {
    background: #555;
  }

  button.save {
    background: #3fa66a;
  }

  button:hover {
    filter: brightness(1.1);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .range-title {
    text-align: center;
    font-size: 16px;
    margin-top: 25px;
  }

  .range-value {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    margin: 5px 0;
  }

  .details {
    text-align: center;
    font-size: 14px;
    color: #cccccc;
  }

  .error {
    text-align: center;
    font-size: 14px;
    color: #e06c6c;
    min-height: 18px;
    margin-top: 8px;
  }

  /* ---- Saved shots side panel ---- */

  .panel {
    width: 340px;
    max-width: 95vw;
    background: #2b2b2b;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
  }

  .panel-header h2 {
    font-size: 18px;
    margin: 0;
  }

  .panel-header button {
    padding: 6px 12px;
    font-size: 13px;
  }

  .shot-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 520px;
    overflow-y: auto;
  }

  .shot {
    background: #1e1e1e;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .shot:hover {
    border-color: #4a90d9;
  }

  .shot-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .shot-range {
    font-size: 20px;
    font-weight: bold;
    color: #6fb3f0;
  }

  .shot-delete {
    background: transparent;
    color: #e06c6c;
    border: none;
    font-size: 16px;
    padding: 2px 6px;
    cursor: pointer;
  }

  .shot-coords {
    font-size: 12px;
    color: #aaaaaa;
    margin-top: 4px;
    word-break: break-word;
  }

  .shot-note {
    font-size: 13px;
    color: #e0e0e0;
    margin-top: 6px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty {
    color: #888;
    font-size: 14px;
    text-align: center;
    padding: 20px 0;
  }

  .hint {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 12px;
  }

  /* ---- Mobile responsiveness ---- */
  @media (max-width: 700px) {
    body {
      padding: 15px 12px;
      gap: 15px;
    }

    .card,
    .panel {
      width: 100%;
      max-width: 100%;
      padding: 18px;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .range-value {
      font-size: 34px;
    }

    /* Buttons go full-width and stack nicely on narrow screens. */
    .buttons {
      gap: 8px;
    }

    .buttons button {
      flex: 1 1 auto;
      min-width: 45%;
    }

    .shot-list {
      max-height: none;
    }

    /* Larger tap target for deleting a shot on touch screens. */
    .shot-delete {
      font-size: 20px;
      padding: 4px 10px;
    }
  }

  /* Prevent iOS from zooming when focusing inputs (needs >=16px font). */
  @media (max-width: 700px) {
    input[type="text"],
    textarea {
      font-size: 16px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>WARDOGS MORTAR CALCULATOR</h1>

    <label for="mortar">Mortar Position (A)</label>
    <input type="text" id="mortar" placeholder="x93.56, y121.11" autofocus>

    <label for="target">Target Position (B)</label>
    <input type="text" id="target" placeholder="x105.20, y140.00">

    <label for="note">Note (optional)</label>
    <textarea id="note" rows="2" placeholder="e.g. enemy bunker, ridge line"></textarea>

    <div class="buttons">
      <button id="calc">Calculate</button>
      <button id="save" class="save">Save Shot</button>
      <button id="clear" class="clear">Clear</button>
    </div>

    <div class="range-title">RANGE</div>
    <div class="range-value" id="range">---</div>
    <div class="details" id="details"></div>
    <div class="error" id="error"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>Saved Shots</h2>
      <button id="clearAll" class="clear">Clear All</button>
    </div>
    <ul class="shot-list" id="shotList"></ul>
    <div class="hint">Click a saved shot to load its coordinates.</div>
  </div>

<script type="module">
  // ---- Firebase setup ----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase,
    ref,
    push,
    remove,
    onValue
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ==============================================================
  // PASTE YOUR FIREBASE CONFIG HERE
  // Firebase Console -> Project settings -> "Your apps" -> config
  // ==============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAOPqU37qHRwMEZPqsU3iUL4xCaOID2zqw",
    authDomain: "wardogs-590f4.firebaseapp.com",
    databaseURL: "https://wardogs-590f4-default-rtdb.firebaseio.com",
    projectId: "wardogs-590f4",
    storageBucket: "wardogs-590f4.firebasestorage.app",
    messagingSenderId: "194004752044",
    appId: "1:194004752044:web:9c70cd04a4cc6fcd047109"
  };

  console.log("[WARDOGS] Script started, initializing Firebase...");

  let app, db, shotsRef;
  try {
    app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    shotsRef = ref(db, "shots");
    console.log("[WARDOGS] Firebase initialized OK");
  } catch (e) {
    console.error("[WARDOGS] Firebase init FAILED:", e);
    alert("Firebase failed to start: " + e.message);
  }

  const mortarEl = document.getElementById("mortar");
  const targetEl = document.getElementById("target");
  const noteEl = document.getElementById("note");
  const rangeEl = document.getElementById("range");
  const detailsEl = document.getElementById("details");
  const errorEl = document.getElementById("error");
  const shotListEl = document.getElementById("shotList");

  // Holds the most recent successful calculation so "Save Shot" can use it.
  let lastResult = null;

  function parseCoordinates(coords) {
    const match = coords.match(
      /\s*x\s*(-?\d+(?:\.\d+)?)\s*,?\s*y\s*(-?\d+(?:\.\d+)?)/i
    );

    if (!match) {
      throw new Error("Use format: x93.56, y121.11");
    }

    return {
      x: parseFloat(match[1]),
      y: parseFloat(match[2])
    };
  }

  function calculateDistance() {
    try {
      const a = parseCoordinates(mortarEl.value);
      const b = parseCoordinates(targetEl.value);

      const dx = b.x - a.x;
      const dy = b.y - a.y;

      const distance = Math.hypot(dx, dy) * 100;

      rangeEl.textContent = distance.toFixed(0) + " m";
      detailsEl.textContent =
        "\u0394X: " + dx.toFixed(2) + "    \u0394Y: " + dy.toFixed(2);
      errorEl.textContent = "";

      lastResult = {
        target: targetEl.value.trim(),
        range: distance.toFixed(0) + " m"
      };
    } catch (err) {
      rangeEl.textContent = "---";
      detailsEl.textContent = "";
      errorEl.textContent = err.message;
      lastResult = null;
    }
  }

  // Clears the target and note but keeps the mortar position in place.
  function clearFields() {
    targetEl.value = "";
    noteEl.value = "";
    rangeEl.textContent = "---";
    detailsEl.textContent = "";
    errorEl.textContent = "";
    lastResult = null;
    targetEl.focus();
  }

  // ---- Saved shots handling (shared via Firebase) ----

  // Renders the list from a Firebase snapshot object. Each shot is stored
  // under a unique key, which we keep so deletes target the right record.
  function renderShots(shotsObj) {
    shotListEl.innerHTML = "";

    const keys = shotsObj ? Object.keys(shotsObj) : [];

    if (keys.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No saved shots yet.";
      shotListEl.appendChild(li);
      return;
    }

    // Newest first (higher createdAt at the top).
    keys.sort(function (a, b) {
      return (shotsObj[b].createdAt || 0) - (shotsObj[a].createdAt || 0);
    });

    keys.forEach(function (key) {
      const shot = shotsObj[key];

      const li = document.createElement("li");
      li.className = "shot";

      const top = document.createElement("div");
      top.className = "shot-top";

      const range = document.createElement("span");
      range.className = "shot-range";
      range.textContent = shot.range;

      const del = document.createElement("button");
      del.className = "shot-delete";
      del.textContent = "\u2715";
      del.title = "Delete this shot";
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        deleteShot(key);
      });

      top.appendChild(range);
      top.appendChild(del);

      const coords = document.createElement("div");
      coords.className = "shot-coords";
      coords.textContent = "Target: " + shot.target;

      li.appendChild(top);
      li.appendChild(coords);

      if (shot.note) {
        const note = document.createElement("div");
        note.className = "shot-note";
        note.textContent = shot.note;
        li.appendChild(note);
      }

      // Quick select: clicking the shot loads its target coordinate.
      // The current mortar position is left untouched.
      li.addEventListener("click", function () {
        targetEl.value = shot.target;
        noteEl.value = shot.note || "";
        calculateDistance();
      });

      shotListEl.appendChild(li);
    });
  }

  function saveCurrentShot() {
    // Saving only requires a valid target. Notes are optional, and the
    // mortar position is not needed to save a target.
    let target;
    try {
      parseCoordinates(targetEl.value);
      target = targetEl.value.trim();
    } catch (err) {
      errorEl.textContent = "Enter a valid target to save. " + err.message;
      return;
    }

    // Compute the range if a mortar position is available, otherwise leave
    // it blank so a target can be stored on its own.
    let range = "\u2014";
    try {
      const a = parseCoordinates(mortarEl.value);
      const b = parseCoordinates(targetEl.value);
      range = (Math.hypot(b.x - a.x, b.y - a.y) * 100).toFixed(0) + " m";
    } catch (err) {
      // No valid mortar position; store the target without a range.
    }

    errorEl.textContent = "";

    // Push to Firebase. The realtime listener re-renders for everyone,
    // including this page, so no manual render call is needed here.
    push(shotsRef, {
      target: target,
      range: range,
      note: noteEl.value.trim(),
      createdAt: Date.now()
    }).catch(function (err) {
      errorEl.textContent = "Could not save shot: " + err.message;
    });
  }

  function deleteShot(key) {
    remove(ref(db, "shots/" + key)).catch(function (err) {
      errorEl.textContent = "Could not delete shot: " + err.message;
    });
  }

  function clearAllShots() {
    if (confirm("Clear all saved shots for everyone?")) {
      remove(shotsRef).catch(function (err) {
        errorEl.textContent = "Could not clear shots: " + err.message;
      });
    }
  }

  // Live subscription: fires now with current data and again on any change
  // made by anyone, so all open pages stay in sync automatically.
  // Sorting is done in renderShots (by createdAt), so no orderByChild index
  // is required here.
  onValue(shotsRef, function (snapshot) {
    console.log("[WARDOGS] Data update received:", snapshot.val());
    renderShots(snapshot.val());
  }, function (err) {
    console.error("[WARDOGS] Listener error:", err);
    errorEl.textContent = "Live sync error: " + err.message;
  });

  // ---- Wire up controls ----

  document.getElementById("calc").addEventListener("click", calculateDistance);
  document.getElementById("save").addEventListener("click", saveCurrentShot);
  document.getElementById("clear").addEventListener("click", clearFields);
  document.getElementById("clearAll").addEventListener("click", clearAllShots);

  // Pressing Enter calculates.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
      calculateDistance();
    }
  });

  // Initial and ongoing rendering is handled by the Firebase onValue
  // listener above, so no manual initial render is needed here.

  // ---- PWA: register service worker so the app is installable ----
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").then(function () {
      console.log("[WARDOGS] Service worker registered");
    }).catch(function (err) {
      console.log("[WARDOGS] Service worker registration failed:", err);
    });
  }
</script>
</body>
</html>
